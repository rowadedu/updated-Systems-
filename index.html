*{box-sizing:border-box}
body,button,input,select{font-family:"RB",Tahoma,sans-serif!important;font-synthesis:none}
body{margin:0;color:var(--ink);background:radial-gradient(1000px 500px at 85% -10%,var(--glow),transparent),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:16px;padding:16px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{width:170px;height:56px;background:var(--logo) center/contain no-repeat}
header h1{margin:0;font-size:22px;color:var(--teal2);flex:1}
.tools button,.tabs button,.btn{font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.tabs{display:flex;gap:8px;padding:14px 28px;flex-wrap:wrap}
.tabs button.on,.btn.p{background:var(--teal);color:var(--on);font-weight:700;border-color:var(--teal)}
.tools button:hover,.tabs button:hover,.btn:hover{border-color:var(--teal)}
main{padding:6px 28px 60px;max-width:1300px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{margin:0 0 4px;color:var(--teal2);font-size:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
input,select{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px}
input:focus,select:focus{outline:2px solid var(--teal)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal)}
.mem{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line)}
.mem input{flex:1;min-width:0}
.x{background:none;border:0;color:#ff7b7b;cursor:pointer;font-size:13.5px;font-weight:700;padding:4px 6px}
.head{color:var(--mute);font-size:13px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--teal2)}
tr.done td.t{text-decoration:line-through;color:var(--mute)}
.pts{color:var(--teal);font-weight:700}
.bar{height:8px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;min-width:120px}

const certPos=e=>{const r=$('ccv').getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100,ar:r.width/r.height}};

  if(e.target.id!=='ccv'||LOCKED())return;const cfg=CF(),p=certPos(e);let best=null,bd=1e9;
  for(const k in cfg.f){const f=cfg.f[k];if(!f.on)continue;const d=Math.hypot((f.x-p.x)*p.ar,f.y-p.y);if(d<bd){bd=d;best=k}}
  CDRAG=best;e.target.setPointerCapture(e.pointerId);e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!CDRAG||!$('ccv'))return;const p=certPos(e),f=CF().f[CDRAG];
  f.x=Math.abs(p.x-50)<1.2?50:Math.round(Math.min(98,Math.max(2,p.x))*10)/10;f.y=Math.round(Math.min(98,Math.max(2,p.y))*10)/10;

});

function dashData(p,cf){

  const done=T.filter(t=>t.done),open=T.filter(t=>!t.done),late=open.filter(t=>t.due&&t.due<today);
  const tm=done.filter(t=>t.due&&t.doneAt),ont=tm.filter(t=>iso(new Date(t.doneAt))<=t.due).length;
  const byCom=S.com.filter(c=>cf==='all'||c.id===cf).map(c=>{const a=T.filter(t=>t.com===c.id);return {n:c.name,t:a.length,d:a.filter(t=>t.done).length,l:a.filter(t=>!t.done&&t.due&&t.due<today).length}});
  const byPri=Object.keys(PRI).map(k=>({k,n:T.filter(t=>(t.pri||'متوسطة')===k).length}));
  const pm={};T.forEach(t=>wsOf(t).forEach(w=>{const o=pm[w]=pm[w]||{name:w,d:0,o:0,pts:0,l:0};if(t.done){o.d++;o.pts+=+t.pts||0}else{o.o++;if(t.due&&t.due<today)o.l++}}));
  const ppl=Object.values(pm),top=[...ppl].sort((a,b)=>b.pts-a.pts||b.d-a.d),load=[...ppl].filter(x=>x.o).sort((a,b)=>b.o-a.o);

  const ms=S.meet.filter(m=>inR(m.date,r[0]?r:['0000','9999'])&&(cf==='all'||m.com===cf||m.com==='all'));
  const tr=[...Array(8).keys()].reverse().map(i=>{const d=D(monday(new Date()));d.setDate(d.getDate()-7*i);const k=iso(d),a=S.tasks.filter(t=>t.week===k&&(cf==='all'||t.com===cf));return {k,d:a.filter(t=>t.done).length,t:a.length}});
  return {T,done,open,late,ontime:tm.length?Math.round(ont/tm.length*100):null,byCom,byPri,top,load,idle,ms,tr,pts:done.reduce((s,t)=>s+(+t.pts||0),0),amb:ambStats(p),active:ppl.filter(x=>x.d).length};
}

/* ================= المشاريع (Gantt) ================= */
const dd=(a,b)=>Math.round((D(b)-D(a))/864e5);
const addD=(a,n)=>{const d=D(a);d.setDate(d.getDate()+n);return iso(d)};
const PCOLS=['#26d0ce','#4da3ff','#a78bfa','#e0b04b','#34d399','#ff8fa3','#ff9f43'];
function pRange(p){const it=(p.items||[]).filter(i=>i.start&&i.end);const s=[p.start,...it.map(i=>i.start)].filter(Boolean).sort()[0]||'',e=[p.end,...it.map(i=>i.end)].filter(Boolean).sort().pop()||'';return [s,e]}
function pProg(p){const it=(p.items||[]).filter(i=>i.start&&i.end);if(!it.length)return +p.prog||0;let w=0,s=0;it.forEach(i=>{const d=Math.max(1,dd(i.start,i.end)+1);w+=d;s+=d*(+i.prog||0)});return Math.round(s/w)}
function gantt(rows){
  const v=rows.filter(r=>r.s&&r.e&&r.e>=r.s);if(!v.length)return '<div class="empty">أضف تواريخ البداية والنهاية لتظهر على المخطط</div>';
  const today=iso(new Date());let a=v.map(r=>r.s).sort()[0],b=v.map(r=>r.e).sort().pop();
  a=addD(a,-2);b=addD(b,3);if(GZ==='m'){a=a.slice(0,8)+'01';const e=D(b);b=iso(new Date(e.getFullYear(),e.getMonth()+1,0))}
  const ppd={d:34,w:15,m:5}[GZ],n=dd(a,b)+1,W=n*ppd,R=d=>dd(a,d)*ppd;
  let mo='',dy='',gr='';
  for(let d=a;d<=b;){const x=D(d),me=iso(new Date(x.getFullYear(),x.getMonth()+1,0)),e=me<b?me:b;mo+=`<div class="gt-m" style="right:${R(d)}px;width:${(dd(d,e)+1)*ppd}px">${x.toLocaleDateString('ar-SA',{month:'long',year:'numeric'})}</div>`;d=addD(e,1)}
  for(let i=0;i<n;i++){const d=addD(a,i),x=D(d);
    if(GZ==='d'){dy+=`<div class="gt-d ${x.getDay()===5||x.getDay()===6?'we':''}" style="right:${i*ppd}px;width:${ppd}px">${x.getDate()}</div>`;gr+=`<div class="gt-g" style="right:${i*ppd}px"></div>`}
    else if(GZ==='w'&&x.getDay()===6){dy+=`<div class="gt-d" style="right:${i*ppd}px;width:${7*ppd}px">${x.toLocaleDateString('ar-SA',{day:'numeric',month:'numeric'})}</div>`;gr+=`<div class="gt-g" style="right:${i*ppd}px"></div>`}
    else if(GZ==='m'&&x.getDate()===1)gr+=`<div class="gt-g" style="right:${i*ppd}px"></div>`}
  const now=today>=a&&today<=b?`<div class="gt-now" style="right:${R(today)+ppd/2}px"></div>`:'';
  const row=r=>{const c=/^#[0-9a-f]{6}$/i.test(r.c||'')?r.c:'#26d0ce',late=r.e<today&&(+r.prog||0)<100,x=R(r.s),wd=(dd(r.s,r.e)+1)*ppd;
    const bar=r.ms?`<div class="gt-ms" style="right:${x+ppd/2-9}px;background:${c}" title="${esc(r.l)}"></div>`:`<div class="gt-b ${late?'late':''}" style="right:${x}px;width:${wd}px;background:${c}44;border-color:${c}" title="${esc(r.l)} · ${esc(fmtD(r.s))} ← ${esc(fmtD(r.e))} · ${+r.prog||0}%"><i style="width:${Math.min(100,+r.prog||0)}%;background:${c}"></i><span>${wd>70?(+r.prog||0)+'%':''}</span></div>`;
    return `<div class="gt-row"><div class="gt-l"><b>${r.ms?'◆ ':''}${esc(r.l)}</b>${r.sub?`<small>${esc(r.sub)}</small>`:''}</div><div class="gt-t" style="width:${W}px">${gr}${now}${bar}</div></div>`};
  return `<div class="gt"><div style="width:${W+230}px"><div class="gt-row gt-h"><div class="gt-l"><b>${GZ==='d'?'يومي':GZ==='w'?'أسبوعي':'شهري'}</b></div><div class="gt-t" style="width:${W}px">${mo}${dy}${now}</div></div>${v.map(row).join('')}</div></div>`;
}
function vProj(){
  const ps=S.proj||[],cur=ps.find(p=>p.id===PJ),today=iso(new Date()),P=allPeople();
  const pOpt=sel=>`<option value="">—</option>`+P.map(p=>`<option${p===sel?' selected':''}>${esc(p)}</option>`).join('');

  <div class="row free"><button class="chip ${!cur?'on':''}" data-xa="pjSel" data-id="all">كل المشاريع</button>${ps.map(p=>`<button class="chip ${cur&&cur.id===p.id?'on':''}" data-xa="pjSel" data-id="${p.id}"><span style="color:${esc(p.color)}">●</span> ${esc(p.name)}</button>`).join('')}
   <span style="margin-inline-start:auto"></span>${[['d','يوم'],['w','أسبوع'],['m','شهر']].map(([k,l])=>`<button class="chip ${GZ===k?'on':''}" data-xa="gz" data-k="${k}">${l}</button>`).join('')}</div>`;
  if(!ps.length)return h+'<div class="empty">لا توجد مشاريع بعد. أضف مشروعًا ثم أضف مراحله لتظهر على مخطط جانت.</div>';

    +gantt(st.map(x=>({l:x.p.name,sub:[cname(x.p.com)!=='—'?cname(x.p.com):'',x.p.owner].filter(Boolean).join(' · '),s:x.s,e:x.e,prog:x.pr,c:x.p.color})))
    +`<div class="grid" style="margin-top:14px">`+st.map(x=>`<div class="card"><h3><span style="color:${esc(x.p.color)}">●</span> ${esc(x.p.name)}</h3><small>${esc(cname(x.p.com)!=='—'?cname(x.p.com):'')} ${x.p.owner?'· '+esc(x.p.owner):''}</small><small>${x.s?esc(fmtD(x.s)):'—'} ← ${x.e?esc(fmtD(x.e)):'—'} ${x.late?'<span class="late">متأخر</span>':''}</small><div class="row"><div class="bar" style="flex:1"><i style="width:${x.pr}%"></i></div><span class="pts">${x.pr}%</span></div><button class="btn" data-xa="pjSel" data-id="${x.p.id}">فتح المخطط ←</button></div>`).join('')+`</div>`;
  }
  const it=(cur.items=cur.items||[]).slice().sort((a,b)=>(a.start||'9').localeCompare(b.start||'9')),pr=pProg(cur),[s,e]=pRange(cur);
  h+=`<div class="card"><div class="row"><span style="font-size:22px;color:${esc(cur.color)}">●</span><input data-x="pp" data-k="name" value="${esc(cur.name)}" style="flex:1;min-width:180px;font-weight:700;font-size:17px"><select data-x="pp" data-k="com"><option value="">اللجنة / المسار</option>${comOpts(cur.com)}</select><select data-x="pp" data-k="owner">${pOpt(cur.owner)}</select><input type="color" data-x="pp" data-k="color" value="${esc(cur.color||'#26d0ce')}" style="width:46px;height:36px;padding:2px"><button class="x" data-xa="pjDel" title="حذف المشروع">حذف</button></div>
   <div class="row"><input data-x="pp" data-k="desc" value="${esc(cur.desc||'')}" placeholder="وصف / هدف المشروع" style="flex:1"></div>
   <div class="row"><span class="head">${s?esc(fmtD(s)):'—'} ← ${e?esc(fmtD(e)):'—'}</span><div class="bar" style="flex:1"><i style="width:${pr}%"></i></div><span class="pts">${pr}% مكتمل</span></div></div>`
  +gantt(it.map(i=>({l:i.name,sub:[i.owner,(+i.prog||0)+'%'].filter(Boolean).join(' · '),s:i.start,e:i.ms?i.start:i.end,prog:i.prog,c:cur.color,ms:i.ms})))
  +`<h2>مراحل المشروع</h2><table><tr><th>المرحلة / البند</th><th>المسؤول</th><th>البداية</th><th>النهاية</th><th>الإنجاز</th><th>◆ معلم</th><th></th></tr>`+it.map(i=>`<tr class="${(+i.prog||0)>=100?'done':''}"><td class="t"><input data-x="pi" data-id="${i.id}" data-k="name" value="${esc(i.name)}" style="width:100%"></td><td><select data-x="pi" data-id="${i.id}" data-k="owner">${pOpt(i.owner)}</select></td><td><input type="date" data-x="pi" data-id="${i.id}" data-k="start" value="${esc(i.start||'')}"></td><td><input type="date" data-x="pi" data-id="${i.id}" data-k="end" value="${esc(i.end||'')}" ${i.ms?'disabled':''} class="${i.end&&i.end<today&&(+i.prog||0)<100?'late':''}"></td>
   <td style="white-space:nowrap"><input type="range" min="0" max="100" step="5" data-x="pi" data-id="${i.id}" data-k="prog" value="${+i.prog||0}" style="width:110px;padding:0"> <span class="pts">${+i.prog||0}%</span></td><td><input type="checkbox" data-x="pi" data-id="${i.id}" data-k="ms" ${i.ms?'checked':''}></td><td><button class="x" data-xa="piDel" data-id="${i.id}">حذف</button></td></tr>`).join('')
  +`<tr class="add"><td><input id="piN" placeholder="اسم المرحلة" style="width:100%"></td><td><select id="piO">${pOpt('')}</select></td><td><input id="piS" type="date" value="${esc(e&&e>=today?today:(s||today))}"></td><td><input id="piE" type="date"></td><td colspan="2"><label class="sw" style="padding:0"><input type="checkbox" id="piM"> معلم (تاريخ واحد)</label></td><td><button class="btn p" data-xa="piAdd">＋</button></td></tr></table>`;

const GK=()=>S.mail.gkey=S.mail.gkey||rid()+rid();
const gasCode=()=>`/* خدمة أكاديمية روّاد: البريد + المساعد الذكي — الإصدار 2 */
const SECRET='${GK()}';
function doPost(e){
  try{

    if(a==='mail')return out(mail_(d));
    if(a==='ai')return out(ai_(d));
    if(a==='form')return out(form_(d));

function mail_(d){

function status_(){const p=P_();return {ok:true,v:2,gemini:!!p.getProperty('GEMINI_API_KEY'),claude:!!p.getProperty('ANTHROPIC_API_KEY'),gmodel:p.getProperty('GEMINI_MODEL')||'gemini-flash-latest',cmodel:p.getProperty('CLAUDE_MODEL')||'claude-haiku-5-5',left:MailApp.getRemainingDailyQuota()}}
function cfg_(d){const p=P_(),m={gemini:'GEMINI_API_KEY',claude:'ANTHROPIC_API_KEY',gmodel:'GEMINI_MODEL',cmodel:'CLAUDE_MODEL'};
  Object.keys(m).forEach(k=>{if(d[k]==='-')p.deleteProperty(m[k]);else if(d[k])p.setProperty(m[k],String(d[k]).trim())});return status_()}
function ai_(d){
  const p=P_(),gk=p.getProperty('GEMINI_API_KEY'),ck=p.getProperty('ANTHROPIC_API_KEY');let prov=d.provider||'auto';
  if(prov==='auto')prov=gk?'gemini':ck?'claude':'';
  if(!prov)return {ok:false,error:'لم يُضف أي مفتاح للذكاء الاصطناعي بعد'};
  const msgs=(d.messages||[]).slice(-14);
  if(prov==='gemini'){
    if(!gk)return {ok:false,error:'مفتاح Gemini غير مضاف'};
    const model=p.getProperty('GEMINI_MODEL')||'gemini-flash-latest';
    const body={systemInstruction:{parts:[{text:d.system||''}]},contents:msgs.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:String(m.content)}]})),generationConfig:{temperature:0.6,maxOutputTokens:8192}};
    const r=UrlFetchApp.fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent',{method:'post',contentType:'application/json',headers:{'x-goog-api-key':gk},payload:JSON.stringify(body),muteHttpExceptions:true});
    const j=JSON.parse(r.getContentText());if(r.getResponseCode()!==200)return {ok:false,error:(j.error&&j.error.message)||('Gemini HTTP '+r.getResponseCode())};
    const c=((j.candidates||[])[0]||{}).content||{};return {ok:true,provider:'gemini',text:(c.parts||[]).map(x=>x.text||'').join('')};
  }
  if(!ck)return {ok:false,error:'مفتاح Claude غير مضاف'};
  const model=p.getProperty('CLAUDE_MODEL')||'claude-haiku-5-5';
  const r=UrlFetchApp.fetch('https://api.anthropic.com/v1/messages',{method:'post',contentType:'application/json',headers:{'x-api-key':ck,'anthropic-version':'2023-06-01'},payload:JSON.stringify({model:model,max_tokens:4096,system:d.system||'',messages:msgs.map(m=>({role:m.role==='assistant'?'assistant':'user',content:String(m.content)}))}),muteHttpExceptions:true});
  const j=JSON.parse(r.getContentText());if(r.getResponseCode()!==200)return {ok:false,error:(j.error&&j.error.message)||('Claude HTTP '+r.getResponseCode())};
  return {ok:true,provider:'claude',text:(j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('')};
}
function form_(d){
  const f=FormApp.create(d.title||'نموذج');f.setDescription(d.desc||'');if(d.email)f.setCollectEmail(true);

    if(q.t==='section'){f.addSectionHeaderItem().setTitle(q.q||'').setHelpText(q.h||'');return}
    if(q.t==='para')it=f.addParagraphTextItem();

    else if(q.t==='check'&&o.length)it=f.addCheckboxItem().setChoiceValues(o);

    else if(q.t==='date')it=f.addDateItem();
    else if(q.t==='time')it=f.addTimeItem();
    else if(q.t==='email')it=f.addTextItem().setValidation(FormApp.createTextValidation().requireTextIsEmail().build());
    else it=f.addTextItem();

  return {ok:true,edit:f.getEditUrl(),url:f.getPublishedUrl(),sheet:sheet};

    if(u.role==='head'&&Object.values(USERS).filter(x=>x.role==='head').length<=1)return alert('لا يمكن حذف الرئيس الوحيد في النظام.');
    if(!confirm('حذف المستخدم «'+(u.name||u.email)+'» نهائيًا من النظام؟\nسيُحذف حسابه في النظام وملفه الشخصي وأنشطته كسفير، ولن يستطيع الدخول إلا بعد إعادة اعتماده.'))return;
    const {D,db}=FB,R=p=>D.ref(db,'rowad/'+p);Promise.all([D.set(R('profiles/'+id),null),D.set(R('amb/'+id),null)]).then(()=>D.set(R('users/'+id),null)).then(()=>{if(TEAMV===id)TEAMV='';toast('تم حذف المستخدم ✓')}).catch(e=>toast('تعذّر الحذف: '+(/permission/i.test(String(e&&(e.code||e.message)))?'قواعد Firebase غير منشورة — افتح «قواعد قاعدة البيانات» أعلى هذه الصفحة':String(e&&(e.code||e.message)||''))));return}
  else if(a==='myf')MYF=t.dataset.k;
  else if(a==='dp')DP=t.dataset.k;
  else if(a==='rep')return repWin();
  else if(a==='repTxt'){copyT(repTxt());return toast('تم نسخ الملخص ✓')}
  else if(a==='ambp')AMBP=t.dataset.k;
  else if(a==='th'){lsS('rowad-theme',t.dataset.k);lsS('rowad-acc',null)}
  else if(a==='thReset')lsS('rowad-acc',null);
  else if(a==='thDef'){S.themeDef=THK;toast('تم تعيين المظهر الافتراضي للفريق ✓')}
  else if(a==='pjSel'){PJ=id}
  else if(a==='gz')GZ=t.dataset.k;
  else if(a==='pjAdd'){const n=$('pjN').value.trim();if(!n)return $('pjN').focus();const p={id:uid(),name:n,com:$('pjC').value,owner:$('pjO').value,start:$('pjS').value,end:$('pjE').value,color:$('pjCol').value,desc:'',items:[]};S.proj.push(p);PJ=p.id}
  else if(a==='pjDel'){if(!cur||!confirm('حذف المشروع «'+cur.name+'» وكل مراحله؟'))return;S.proj=S.proj.filter(p=>p!==cur);PJ='all'}
  else if(a==='piAdd'){if(!cur)return;const n=$('piN').value.trim();if(!n)return $('piN').focus();const s=$('piS').value,m=$('piM').checked;let en=$('piE').value;if(!m&&s&&(!en||en<s))en=addD(s,6);cur.items.push({id:uid(),name:n,owner:$('piO').value,start:s,end:m?s:en,prog:0,ms:m})}
  else if(a==='piDel'){if(cur)cur.items=cur.items.filter(x=>x.id!==id)}
  else if(a==='ambAdd'){
    const T=$('aT').value,n=Math.max(1,+$('aN').value||1),d=$('aD').value||iso(new Date()),note=$('aNo').value.trim().slice(0,200),link=safeUrl($('aL').value);let u,nm;
    if(ROLE==='amb'){u=ME.uid;nm=(PROF[u]||{}).name||ME.name}else if(FB){u=$('aU').value;if(!u)return toast('اختر السفير');nm=(USERS[u]||{}).name||''}else{nm=$('aU').value.trim();if(!nm)return $('aU').focus();u='l_'+nz(nm).replace(/\s/g,'_')}
    ambWrite(u,rid(),{t:T,n,d,note,link,nm,ts:Date.now(),st:'ok',by:ME?ME.uid:''}).then(()=>{toast('تمت إضافة النشاط ✓');if(!FB)render()}).catch(()=>toast('تعذّر الحفظ — تأكد من تحديث قواعد Firebase'));return}
  else if(a==='ambDel'){const own=ME&&t.dataset.u===ME.uid;if(!(isHead()||own))return;if(!confirm('حذف هذا النشاط؟'))return;ambWrite(t.dataset.u,id,null).then(()=>{if(!FB)render()}).catch(()=>toast('تعذّر الحذف'));return}
  else if(a==='ambRej'){const x=ambAll().find(z=>z.uid===t.dataset.u&&z.id===id);if(!x)return;const {uid:_u,id:_i,...v}=x;v.st=x.st==='rej'?'ok':'rej';ambWrite(t.dataset.u,id,v).then(()=>{if(!FB)render()}).catch(()=>toast('تعذّر التعديل'));return}
  else if(a==='atAdd'){S.ambT=ambT().map(x=>({...x}));S.ambT.push({k:'t'+uid(),n:'نشاط جديد',p:5})}
  else if(a==='atDel'){S.ambT=ambT().map(x=>({...x}));if(S.ambT.length>1)S.ambT.splice(i,1)}
  else if(a==='meSave')return meSave();
  else if(a==='meAv')return pickImg(u=>{const prev=(PROF[ME.uid]||{}).av;PROF[ME.uid]={...(PROF[ME.uid]||{}),av:u};render();toast('جاري حفظ الصورة…');FB.D.update(FB.D.ref(FB.db,'rowad/profiles/'+ME.uid),{av:u}).then(()=>toast('تم تحديث الصورة ✓')).catch(e=>{PROF[ME.uid].av=prev;render();const pd=/permission/i.test(String(e&&(e.code||e.message)));toast(pd?(isHead()?'تعذّر حفظ الصورة: قواعد Firebase غير منشورة — افتح تبويب «المستخدمون» ← «قواعد قاعدة البيانات»':'تعذّر حفظ الصورة: يجب على الرئيس نشر قواعد Firebase أولًا'):'تعذّر حفظ الصورة: '+String(e&&(e.code||e.message)||'خطأ غير معروف'))})});
  else if(a==='meAvRm')return FB.D.update(FB.D.ref(FB.db,'rowad/profiles/'+ME.uid),{av:null}).catch(()=>{});
  else if(a==='aiSend'){const v=$('aiin').value;return aiAsk(v)}
  else if(a==='aiQ')return aiAsk(t.dataset.q);
  else if(a==='aiClr')AIH=[];
  else if(a==='aiCp'){copyT(AIH[i].content);return toast('تم النسخ ✓')}
  else if(a==='aiKeys'){const o={action:'cfg'},g=x=>($(x).value||'').trim();if(g('kG'))o.gemini=g('kG');if(g('kC'))o.claude=g('kC');if(g('mG'))o.gmodel=g('mG');if(g('mC'))o.cmodel=g('mC');if(Object.keys(o).length<2)return toast('اكتب مفتاحًا أولًا');
    AISTAT={loading:true};render();gasSend(o).then(r=>{AISTAT=r.ok?r:{ok:false,error:r.error};toast(r.ok?'تم حفظ المفاتيح ✓':'تعذّر الحفظ: '+(r.error||''));render()});return}
  else if(a==='aiDelK'){if(!confirm('حذف المفتاح؟'))return;AISTAT={loading:true};render();gasSend({action:'cfg',[t.dataset.k]:'-'}).then(r=>{AISTAT=r.ok?r:{ok:false,error:r.error};render()});return}
  else if(a==='fSel')FSEL=i;
  else if(a==='fNew'){S.forms.push({id:uid(),name:'قالب جديد',title:'نموذج جديد — أكاديمية روّاد',desc:'',email:false,sheet:true,qs:[Q('text','الاسم الكامل',1)]});FSEL=S.forms.length-1}
  else if(a==='fDup'&&f){S.forms.push({...JSON.parse(JSON.stringify(f)),id:uid(),name:f.name+' (نسخة)'});FSEL=S.forms.length-1}
  else if(a==='fDel'&&f){if(!confirm('حذف القالب «'+f.name+'»؟'))return;S.forms.splice(FSEL,1);FSEL=0}
  else if(a==='fqAdd'&&f)f.qs.push(Q('text','سؤال جديد'));
  else if(a==='fqDel'&&f)f.qs.splice(i,1);
  else if(a==='fqMv'&&f){const j=i+(+t.dataset.d);if(j<0||j>=f.qs.length)return;[f.qs[i],f.qs[j]]=[f.qs[j],f.qs[i]]}
  else if(a==='fGen')return fGen();
  else if(a==='fMake')return fMake();
  else if(a==='fCp'){copyT(t.dataset.u);return toast('تم نسخ الرابط ✓')}
  render();
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset&&t.dataset.x;if(!k||k==='tsearch')return;if(LOCKED()&&!FREEX.includes(k))return;
  const v=t.type==='checkbox'?t.checked:t.value,cur=(S.proj||[]).find(p=>p.id===PJ),f=(S.forms||[])[FSEL];
  if(k==='myp'){MYV=v;if(!FB)S.myp=v}
  else if(k==='dc')DC=v;
  else if(k==='acc')lsS('rowad-acc',v);
  else if(k==='aip')S.mail.aip=v;
  else if(k==='aictx')S.mail.aictx=v;
  else if((k==='ut'||k==='up')&&!isBoss())return;
  else if(k==='ut'){const u=t.dataset.id;if(FB)FB.D.update(FB.D.ref(FB.db,'rowad/profiles/'+u),{title:String(v).trim().slice(0,80)||null}).then(()=>toast('تم حفظ المنصب ✓')).catch(()=>toast('تعذّر الحفظ'));return}
  else if(k==='up'){const u=t.dataset.id;if(FB){FB.D.set(FB.D.ref(FB.db,'rowad/users/'+u+'/person'),v||null).catch(()=>toast('تعذّر الحفظ'));FB.D.update(FB.D.ref(FB.db,'rowad/profiles/'+u),{person:v||null}).catch(()=>{})}return}
  else if(k==='pp'&&cur)cur[t.dataset.k]=v;
  else if(k==='pi'&&cur){const it=cur.items.find(x=>x.id===t.dataset.id);if(!it)return;const kk=t.dataset.k;it[kk]=kk==='prog'?+v:v;if(kk==='ms'&&v)it.end=it.start;if(kk==='start'&&it.ms)it.end=v;if(kk==='start'&&it.end&&it.end<v)it.end=v}
  else if(k==='atp'){S.ambT=ambT().map(x=>({...x}));const r=S.ambT[+t.dataset.i];if(r)r[t.dataset.k]=t.dataset.k==='p'?Math.max(0,+v||0):v}
  else if(k==='fm'&&f)f[t.dataset.k]=v;
  else if(k==='fq'&&f){const q=f.qs[+t.dataset.i],kk=t.dataset.k;if(!q)return;q[kk]=kk==='o'?String(v).split('\n').map(s=>s.trim()).filter(Boolean):kk==='max'?+v:v}
  render();
});
document.addEventListener('input',e=>{
  const t=e.target;if(t.dataset&&t.dataset.x==='tsearch'){const q=nz(t.value);document.querySelectorAll('.pcard').forEach(c=>c.style.display=!q||c.dataset.s.includes(q)?'':'none')}
  if(t.dataset&&t.dataset.x==='pi'&&t.dataset.k==='prog'){const s=t.nextElementSibling;if(s)s.textContent=t.value+'%'}
});
document.addEventListener('keydown',e=>{if(e.target.id==='aiin'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();aiAsk(e.target.value)}if(e.target.id==='fAI'&&e.key==='Enter'){e.preventDefault();fGen()}});
function xAfter(){
  if(S.tab==='cert')certDraw();
  if(S.tab==='ai'){const c=$('chat');if(c)c.scrollTop=c.scrollHeight}
  if(['ai','forms'].includes(S.tab)&&isHead())aiStatus();
}

$('bXls').onclick=xls;
$('bExp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='rowad-tasks-'+new Date().toISOString().slice(0,10)+'.json';a.click()};
$('bImp').onclick=()=>$('fImp').click();
$('fImp').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.com&&d.tasks){snap('قبل رفع ملف',1);{const k=S.nt,mc=S.mail,ce=S.cert;S=d;norm();if(k)S.nt=k;if(mc)S.mail=mc;if(ce)S.cert=ce}render()}else alert('ملف غير صالح')}catch(_){alert('ملف غير صالح')}e.target.value=''};
$('bPrint').onclick=()=>window.print();
if(!CLOUDON)ensureTech();NT();render();if(CLOUDON)cloudBoot();
if(!CLOUDON){const n=NT();if(n.auto&&n.last!==iso(new Date())){n.last=iso(new Date());save();sendDigest(true)}}
if(!CLOUDON){const la=snaps().find(x=>x.auto&&x.name==='نسخة تلقائية');if((S.tasks.length||S.com.some(c=>c.members.length))&&(!la||Date.now()-la.ts>864e5)){snap('نسخة تلقائية',1)}}
</script>
